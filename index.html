<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Roulette</title>
    <meta name="description" content="Can't decide what to watch? Spin for a movie or series. Filter by type, genre, and year.">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a2e'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e94560' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23e94560'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="mast">
            <h1>Movie Roulette</h1>
            <p class="tagline">Can't decide? Let fate choose.</p>
            <p class="catalog" id="catalog"></p>
        </header>

        <div class="filters">
            <div class="filter-group">
                <span class="filter-label" id="typeLabel">Type</span>
                <div class="btn-group" role="group" aria-labelledby="typeLabel">
                    <button class="filter-btn active" type="button" data-type="all">All</button>
                    <button class="filter-btn" type="button" data-type="movie">Movie</button>
                    <button class="filter-btn" type="button" data-type="series">Series</button>
                </div>
            </div>

            <div class="filter-group">
                <span class="filter-label" id="categoryLabel">Category</span>
                <div class="btn-group" role="group" aria-labelledby="categoryLabel">
                    <button class="filter-btn active" type="button" data-category="all">All</button>
                    <button class="filter-btn" type="button" data-category="action">Action</button>
                    <button class="filter-btn" type="button" data-category="comedy">Comedy</button>
                    <button class="filter-btn" type="button" data-category="drama">Drama</button>
                    <button class="filter-btn" type="button" data-category="horror">Horror</button>
                    <button class="filter-btn" type="button" data-category="scifi">Sci-Fi</button>
                    <button class="filter-btn" type="button" data-category="thriller">Thriller</button>
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label" for="yearFilter">Year</label>
                <div class="btn-group">
                    <select id="yearFilter" class="year-select">
                        <option value="">All years</option>
                        <option value="pre2000">Before 2000</option>
                        <option value="2000">2000+</option>
                        <option value="2010">2010+</option>
                        <option value="2020">2020+</option>
                    </select>
                </div>
            </div>

            <div class="filter-group checks">
                <label class="check">
                    <input type="checkbox" id="wildcard">
                    <span>Wildcard only</span>
                </label>
                <p class="wildcard-hint">Unusual or underrated titles</p>
            </div>
        </div>

        <div class="spin-lockup">
            <button class="spin-btn" id="spinBtn" type="button" disabled aria-describedby="poolCount">
                <span class="btn-text">Spin</span>
            </button>
            <p class="pool-count" id="poolCount">Loading the shelf…</p>
            <button class="text-btn" id="clearFilters" type="button" hidden>Clear filters</button>
        </div>

        <section class="result" id="result">
            <div class="poster" id="poster" aria-hidden="true"></div>
            <div class="info">
                <p class="pick-label" id="pickLabel"></p>
                <h2 id="title"></h2>
                <p class="meta" id="meta"></p>
                <p class="description" id="description"></p>
                <div class="tags" id="tags"></div>
                <div class="actions" id="actions"></div>
            </div>
        </section>
        <p class="sr-only" id="liveStatus" aria-live="polite"></p>

        <section class="history" id="history" hidden>
            <div class="history-head">
                <h2 class="history-label">Recent</h2>
                <button class="text-btn" id="tonightBtn" type="button" hidden>Tonight's pick</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </section>
    </div>

    <footer>
        <p>Tonight's pick is already up. Spin for something else.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
